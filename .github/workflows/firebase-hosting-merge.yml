name: Deploy Web e Distribuir Android

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # TAREFA 1: DEPLOY DA VERSÃO WEB
  # ==========================================
  build_and_deploy_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar versão Web
        run: flutter build web

      # AQUI ESTÁ A CORREÇÃO: @v0
      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IFDEX_APP }}'
          channelId: live
          projectId: ifdex-app

  # ==========================================
  # TAREFA 2: DISTRIBUIÇÃO DA VERSÃO ANDROID
  # ==========================================
  build_and_distribute_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Garante histórico completo para leitura de commits
          fetch-depth: 0

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Baixar dependências
        run: flutter pub get

      # ── DECODIFICAÇÃO DO KEYSTORE ──────────────────────────
      - name: Decodificar Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # ── VERSIONAMENTO AUTOMÁTICO ──────────────────────────
      # O --build-number injeta o run_number do GitHub no APK,
      # substituindo o "+1" do pubspec.yaml.
      # Resultado: versão "1.0.0+<run_number>" (ex: 1.0.0+42)
      # Veja docs/ci_cd_versioning.md para detalhes completos.
      - name: Compilar versão Android (APK) com Versão Automática
        env:
          KEYSTORE_FILE: "upload-keystore.jks"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Instalar Firebase CLI no Servidor
        run: npm install -g firebase-tools

      # ── RELEASE NOTES INTELIGENTES ────────────────────────
      # Filtra os commits deste push usando Conventional Commits.
      # Apenas feat/fix/refactor/perf/docs/style aparecem nas notas.
      # Commits com chore/ci/test/wip são descartados.
      - name: Gerar Release Notes Inteligentes
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          # 1. Extrai o campo .message de cada commit via jq
          # 2. Filtra apenas linhas que iniciam com prefixos válidos
          # 3. Salva no arquivo notes.txt
          echo "$COMMITS_JSON" | jq -r '.[].message' | grep -iE '^(feat|fix|refactor|perf|docs|style)' > notes.txt || true

          # Fallback: se nenhum commit passou no filtro, usa mensagem padrão
          if [ ! -s notes.txt ]; then
            echo "Pequenos ajustes de interface e correções de bugs." > notes.txt
          fi

          # Log de debug: mostra no console do GitHub o que foi gerado
          echo "=== RELEASE NOTES GERADAS (Build #${{ github.run_number }}) ==="
          cat notes.txt

      - name: Enviar APK para o App Distribution
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
          --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} \
          --groups "proj-mobile" \
          --token ${{ secrets.FIREBASE_TOKEN }} \
          --release-notes-file notes.txt